services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://trackline:trackline@db:5432/trackline?sslmode=disable
      ADDR: :8080
      BASE_URL: http://localhost:${PORT:-8080}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackline
      POSTGRES_USER: trackline
      POSTGRES_PASSWORD: trackline
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackline -d trackline"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
